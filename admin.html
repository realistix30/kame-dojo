<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kame Dojo — Admin Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0f1e; --bg2: #111827; --panel: #1a2340; --border: #2a3a60;
      --accent: #4a8aff; --gold: #ffe066; --green: #2aaa5a; --red: #dd3333;
      --text: #e8eaf6; --dim: #8a9ac0; --radius: 10px;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    button { cursor: pointer; border: none; font-family: inherit; }

    /* ── Login ── */
    #login-section {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .login-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
      padding: 36px 28px; max-width: 380px; width: 100%;
      display: flex; flex-direction: column; gap: 14px; align-items: center;
    }
    .login-logo  { font-size: 2.5rem; }
    .login-title { font-size: 1.3rem; font-weight: 800; color: var(--gold); }
    .login-sub   { font-size: 0.8rem; color: var(--dim); }
    .login-card form { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 8px; }
    .login-card label { font-size: 0.78rem; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
    .login-card input {
      background: var(--bg2); border: 2px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 0.9rem; padding: 10px 12px; font-family: inherit;
      outline: none; transition: border-color .15s; width: 100%;
    }
    .login-card input:focus { border-color: var(--accent); }
    .login-hint { font-size: 0.72rem; color: var(--dim); line-height: 1.4; }
    .login-error { font-size: 0.82rem; color: var(--red); min-height: 1.2em; text-align: center; }
    .btn-primary {
      background: var(--accent); color: #fff; padding: 10px 22px;
      border-radius: var(--radius); font-size: 1rem; font-weight: 700; width: 100%;
      transition: background .15s;
    }
    .btn-primary:hover { background: #6aaaff; }
    .btn-primary:disabled { opacity: .5; cursor: default; }

    /* ── Admin shell ── */
    #admin-section { display: none; flex-direction: column; min-height: 100vh; }

    .admin-header {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .admin-title { font-size: 1rem; font-weight: 800; color: var(--gold); flex: 1; }
    .admin-header select, .admin-header input[type=text] {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-size: 0.85rem; padding: 6px 10px; font-family: inherit;
    }
    .admin-header select:focus, .admin-header input[type=text]:focus { outline: none; border-color: var(--accent); }
    .btn-sm {
      background: var(--bg2); border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; padding: 6px 14px; font-size: 0.82rem; transition: background .15s;
    }
    .btn-sm:hover { background: var(--panel); border-color: var(--accent); color: var(--accent); }
    .btn-danger { border-color: var(--red); color: var(--red); }
    .btn-danger:hover { background: #2a1010; }
    .btn-success { border-color: var(--green); color: var(--green); }
    .btn-success:hover { background: #0d2a1a; }

    /* ── Question table ── */
    .admin-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .q-count { font-size: 0.8rem; color: var(--dim); }
    .q-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .q-table th {
      text-align: left; padding: 8px 12px; font-size: 0.72rem; color: var(--dim);
      text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border);
      background: var(--bg2); position: sticky; top: 57px;
    }
    .q-table td { padding: 9px 12px; border-bottom: 1px solid #1a2240; vertical-align: middle; }
    .q-table tr:hover td { background: #131d35; }
    .q-id    { font-family: monospace; font-size: 0.78rem; color: var(--dim); white-space: nowrap; }
    .q-lvl   { font-size: 0.75rem; font-weight: 700; color: var(--accent); }
    .q-cat   { font-size: 0.75rem; color: var(--dim); }
    .q-type  { font-size: 0.72rem; background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
    .q-text  { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .q-ans   { font-size: 0.78rem; color: var(--green); }

    /* ── Edit panel (slide-in) ── */
    #edit-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 50;
      align-items: flex-start; justify-content: flex-end;
    }
    #edit-overlay.open { display: flex; }
    .edit-drawer {
      width: min(540px, 100vw); height: 100vh; overflow-y: auto;
      background: var(--panel); border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .edit-header {
      display: flex; align-items: center; gap: 10px; padding: 14px 18px;
      border-bottom: 1px solid var(--border); background: var(--bg2); position: sticky; top: 0;
    }
    .edit-header h2 { font-size: 0.95rem; font-weight: 700; flex: 1; }
    .edit-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .field-group { display: flex; flex-direction: column; gap: 5px; }
    .field-group label { font-size: 0.75rem; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
    .field-group input, .field-group select, .field-group textarea {
      background: var(--bg2); border: 2px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 0.9rem; padding: 8px 12px; font-family: inherit;
      outline: none; transition: border-color .15s; width: 100%; resize: vertical;
    }
    .field-group input:focus, .field-group select:focus, .field-group textarea:focus { border-color: var(--accent); }
    .options-grid { display: flex; flex-direction: column; gap: 6px; }
    .option-row { display: flex; align-items: center; gap: 8px; }
    .option-idx {
      width: 22px; height: 22px; border-radius: 50%; background: var(--border);
      color: var(--text); font-size: 0.72rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .option-idx.correct { background: var(--green); color: #fff; }
    .option-row input { flex: 1; }
    .edit-footer {
      padding: 14px 18px; border-top: 1px solid var(--border);
      display: flex; gap: 10px; background: var(--bg2); position: sticky; bottom: 0;
    }
    .save-status { font-size: 0.8rem; color: var(--dim); align-self: center; flex: 1; }
    .save-status.ok  { color: var(--green); }
    .save-status.err { color: var(--red); }

    /* Loading / empty */
    .admin-loading { padding: 40px; text-align: center; color: var(--dim); }
  </style>
</head>
<body>

<!-- ── Login ─────────────────────────────────────────────── -->
<div id="login-section">
  <div class="login-card">
    <div class="login-logo">🐢</div>
    <div class="login-title">Admin Portal</div>
    <div class="login-sub">亀道場 — Kame Dojo</div>
    <form id="login-form">
      <label for="inp-pass">Admin Password</label>
      <input id="inp-pass" type="password" placeholder="Password" autocomplete="current-password">

      <label for="inp-key" style="margin-top:6px">Supabase Service Role Key</label>
      <input id="inp-key" type="password" placeholder="eyJ…">
      <span class="login-hint">Find in Supabase → Project Settings → API → service_role key</span>

      <div class="login-error" id="login-error"></div>
      <button class="btn-primary" type="submit" id="login-btn">Enter Portal</button>
    </form>
  </div>
</div>

<!-- ── Admin ─────────────────────────────────────────────── -->
<div id="admin-section">
  <div class="admin-header">
    <span class="admin-title">🐢 Kame Dojo — Question Editor</span>
    <input type="text" id="search-box" placeholder="Search…" style="width:160px">
    <select id="filter-level">
      <option value="">All Levels</option>
      <option value="n5">N5</option>
      <option value="n4">N4</option>
      <option value="n3">N3</option>
      <option value="n2">N2</option>
      <option value="n1">N1</option>
    </select>
    <select id="filter-cat">
      <option value="">All Categories</option>
      <option value="kanji">Kanji</option>
      <option value="grammar">Grammar</option>
      <option value="vocabulary">Vocabulary</option>
    </select>
    <button class="btn-sm btn-danger" id="btn-logout">Logout</button>
  </div>

  <div class="admin-body">
    <div class="q-count" id="q-count">Loading…</div>
    <table class="q-table" id="q-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Lvl</th>
          <th>Cat</th>
          <th>Type</th>
          <th>Question</th>
          <th>Answer</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="q-tbody"></tbody>
    </table>
    <div class="admin-loading" id="admin-loading">Loading questions…</div>
  </div>
</div>

<!-- ── Edit drawer ─────────────────────────────────────────── -->
<div id="edit-overlay">
  <div class="edit-drawer">
    <div class="edit-header">
      <h2 id="edit-title">Edit Question</h2>
      <button class="btn-sm" id="edit-close">✕ Close</button>
    </div>
    <div class="edit-body">

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
        <div class="field-group">
          <label>Level</label>
          <select id="e-level">
            <option value="n5">N5</option><option value="n4">N4</option>
            <option value="n3">N3</option><option value="n2">N2</option>
            <option value="n1">N1</option>
          </select>
        </div>
        <div class="field-group">
          <label>Category</label>
          <select id="e-cat">
            <option value="kanji">Kanji</option>
            <option value="grammar">Grammar</option>
            <option value="vocabulary">Vocabulary</option>
          </select>
        </div>
        <div class="field-group">
          <label>Type</label>
          <select id="e-type">
            <option value="multiple_choice">Multiple Choice</option>
            <option value="reorder">Reorder</option>
          </select>
        </div>
      </div>

      <div class="field-group">
        <label>Question</label>
        <textarea id="e-question" rows="3"></textarea>
      </div>

      <div class="field-group" id="options-section">
        <label>Options &amp; Correct Answer</label>
        <div class="options-grid" id="options-grid">
          <!-- rendered dynamically -->
        </div>
        <div style="font-size:.75rem;color:var(--dim);margin-top:4px">Click an option label to mark it correct.</div>
      </div>

      <div class="field-group" id="words-section" style="display:none">
        <label>Words (correct order, one per line)</label>
        <textarea id="e-words" rows="4" placeholder="word1&#10;word2&#10;word3"></textarea>
      </div>

      <div class="field-group">
        <label>Explanation</label>
        <textarea id="e-explanation" rows="3"></textarea>
      </div>

    </div>
    <div class="edit-footer">
      <span class="save-status" id="save-status"></span>
      <button class="btn-sm" id="edit-cancel">Cancel</button>
      <button class="btn-sm btn-success" id="edit-save">Save Changes</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
'use strict';

// ── Admin password (SHA-256 hash).
// Default password: "admin"
// To change: run in browser console:
//   crypto.subtle.digest('SHA-256', new TextEncoder().encode('yourpassword'))
//     .then(b => console.log(Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')))
const ADMIN_HASH = '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';

let SERVICE_KEY = '';
let allQuestions = [];
let editingId    = null;
let answerIdx    = 0;

// ── Util ──────────────────────────────────────────────────────────
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function api(path, opts = {}) {
  return fetch(SUPABASE_URL + path, {
    ...opts,
    headers: {
      apikey: SERVICE_KEY,
      Authorization: `Bearer ${SERVICE_KEY}`,
      'Content-Type': 'application/json',
      ...(opts.headers || {}),
    },
  });
}

// ── Login ─────────────────────────────────────────────────────────
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const errEl = document.getElementById('login-error');
  const btn   = document.getElementById('login-btn');
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Verifying…';

  const pass = document.getElementById('inp-pass').value;
  const key  = document.getElementById('inp-key').value.trim();

  try {
    const hash = await sha256(pass);
    if (hash !== ADMIN_HASH) {
      errEl.textContent = 'Incorrect password.';
      btn.disabled = false; btn.textContent = 'Enter Portal';
      return;
    }

    // Validate service key against Supabase
    const test = await fetch(`${SUPABASE_URL}/rest/v1/questions?limit=1`, {
      headers: { apikey: key, Authorization: `Bearer ${key}` },
    });
    if (!test.ok) {
      errEl.textContent = 'Invalid service role key.';
      btn.disabled = false; btn.textContent = 'Enter Portal';
      return;
    }

    SERVICE_KEY = key;
    sessionStorage.setItem('admin-skey', key);
    showAdmin();
  } catch (err) {
    errEl.textContent = 'Error: ' + err.message;
    btn.disabled = false; btn.textContent = 'Enter Portal';
  }
});

function showAdmin() {
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('admin-section').style.display = 'flex';
  loadQuestions();
}

// Auto-restore session
window.addEventListener('DOMContentLoaded', () => {
  const saved = sessionStorage.getItem('admin-skey');
  if (saved) { SERVICE_KEY = saved; showAdmin(); }
});

document.getElementById('btn-logout').addEventListener('click', () => {
  SERVICE_KEY = '';
  sessionStorage.removeItem('admin-skey');
  document.getElementById('admin-section').style.display = 'none';
  document.getElementById('login-section').style.display = 'flex';
  document.getElementById('inp-pass').value = '';
  document.getElementById('login-btn').disabled = false;
  document.getElementById('login-btn').textContent = 'Enter Portal';
});

// ── Load & render questions ───────────────────────────────────────
async function loadQuestions() {
  document.getElementById('admin-loading').style.display = 'block';
  document.getElementById('q-tbody').innerHTML = '';
  document.getElementById('q-count').textContent = 'Loading…';

  try {
    const res  = await api('/rest/v1/questions?select=*&order=level,category,id&limit=2000');
    allQuestions = await res.json();
    renderTable();
  } catch (err) {
    document.getElementById('admin-loading').textContent = 'Failed to load: ' + err.message;
  }
}

function renderTable() {
  const level  = document.getElementById('filter-level').value;
  const cat    = document.getElementById('filter-cat').value;
  const search = document.getElementById('search-box').value.toLowerCase();

  let rows = allQuestions;
  if (level)  rows = rows.filter(q => q.level === level);
  if (cat)    rows = rows.filter(q => q.category === cat);
  if (search) rows = rows.filter(q =>
    q.id.toLowerCase().includes(search) ||
    (q.question || '').toLowerCase().includes(search) ||
    (q.explanation || '').toLowerCase().includes(search)
  );

  document.getElementById('q-count').textContent = `${rows.length} question${rows.length !== 1 ? 's' : ''}`;
  document.getElementById('admin-loading').style.display = 'none';

  const tbody = document.getElementById('q-tbody');
  tbody.innerHTML = '';
  rows.forEach(q => {
    const opts    = Array.isArray(q.options) ? q.options : [];
    const ansText = opts[q.answer] ?? '—';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="q-id">${esc(q.id)}</td>
      <td class="q-lvl">${(q.level||'').toUpperCase()}</td>
      <td class="q-cat">${esc(q.category||'')}</td>
      <td><span class="q-type">${esc(q.type||'mc')}</span></td>
      <td class="q-text" title="${esc(q.question||'')}">${esc(q.question||'')}</td>
      <td class="q-ans">${esc(String(ansText).slice(0,30))}</td>
      <td><button class="btn-sm edit-btn" data-id="${esc(q.id)}">Edit</button></td>`;
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => openEdit(btn.dataset.id));
  });
}

['filter-level','filter-cat'].forEach(id => {
  document.getElementById(id).addEventListener('change', renderTable);
});
document.getElementById('search-box').addEventListener('input', renderTable);

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── Edit drawer ───────────────────────────────────────────────────
function openEdit(id) {
  const q = allQuestions.find(x => x.id === id);
  if (!q) return;
  editingId = id;
  answerIdx = q.answer ?? 0;

  document.getElementById('edit-title').textContent = `Edit — ${id}`;
  document.getElementById('e-level').value       = q.level || 'n5';
  document.getElementById('e-cat').value         = q.category || 'grammar';
  document.getElementById('e-type').value        = q.type || 'multiple_choice';
  document.getElementById('e-question').value    = q.question || '';
  document.getElementById('e-explanation').value = q.explanation || '';
  document.getElementById('save-status').textContent = '';
  document.getElementById('save-status').className   = 'save-status';

  renderTypeFields(q);

  document.getElementById('edit-overlay').classList.add('open');
}

function renderTypeFields(q) {
  const type = document.getElementById('e-type').value;

  const optSec   = document.getElementById('options-section');
  const wordsSec = document.getElementById('words-section');

  if (type === 'reorder') {
    optSec.style.display   = 'none';
    wordsSec.style.display = 'block';
    const words = Array.isArray(q?.words) ? q.words : [];
    document.getElementById('e-words').value = words.join('\n');
  } else {
    optSec.style.display   = 'block';
    wordsSec.style.display = 'none';
    renderOptions(Array.isArray(q?.options) ? q.options : ['', '', '', '']);
  }
}

document.getElementById('e-type').addEventListener('change', () => {
  const q = allQuestions.find(x => x.id === editingId);
  renderTypeFields(q);
});

function renderOptions(opts) {
  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  // Ensure 4 options
  const four = [...opts];
  while (four.length < 4) four.push('');

  four.forEach((opt, i) => {
    const row = document.createElement('div');
    row.className = 'option-row';
    const idx = document.createElement('div');
    idx.className = 'option-idx' + (i === answerIdx ? ' correct' : '');
    idx.textContent = i;
    idx.title = 'Click to mark correct';
    idx.style.cursor = 'pointer';
    idx.addEventListener('click', () => {
      answerIdx = i;
      grid.querySelectorAll('.option-idx').forEach((el, j) => {
        el.className = 'option-idx' + (j === answerIdx ? ' correct' : '');
      });
    });
    const inp = document.createElement('input');
    inp.type  = 'text';
    inp.value = opt;
    inp.placeholder = `Option ${i}`;
    row.appendChild(idx);
    row.appendChild(inp);
    grid.appendChild(row);
  });
}

document.getElementById('edit-close').addEventListener('click',  closeEdit);
document.getElementById('edit-cancel').addEventListener('click', closeEdit);
document.getElementById('edit-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('edit-overlay')) closeEdit();
});

function closeEdit() {
  document.getElementById('edit-overlay').classList.remove('open');
  editingId = null;
}

// ── Save ──────────────────────────────────────────────────────────
document.getElementById('edit-save').addEventListener('click', async () => {
  if (!editingId) return;
  const btn    = document.getElementById('edit-save');
  const status = document.getElementById('save-status');
  btn.disabled = true;
  status.textContent = 'Saving…';
  status.className   = 'save-status';

  const type    = document.getElementById('e-type').value;
  const payload = {
    level:       document.getElementById('e-level').value,
    category:    document.getElementById('e-cat').value,
    type,
    question:    document.getElementById('e-question').value.trim(),
    explanation: document.getElementById('e-explanation').value.trim(),
    answer:      answerIdx,
  };

  if (type === 'reorder') {
    payload.words   = document.getElementById('e-words').value
                        .split('\n').map(s => s.trim()).filter(Boolean);
    payload.options = [];
  } else {
    payload.options = Array.from(
      document.getElementById('options-grid').querySelectorAll('.option-row input')
    ).map(inp => inp.value.trim());
  }

  try {
    const res = await api(
      `/rest/v1/questions?id=eq.${encodeURIComponent(editingId)}`,
      { method: 'PATCH', headers: { Prefer: 'return=representation' }, body: JSON.stringify(payload) }
    );

    if (!res.ok) {
      const err = await res.text();
      throw new Error(err);
    }

    // Update local cache
    const idx = allQuestions.findIndex(q => q.id === editingId);
    if (idx !== -1) allQuestions[idx] = { ...allQuestions[idx], ...payload };
    renderTable();

    status.textContent = '✓ Saved';
    status.className   = 'save-status ok';
  } catch (err) {
    status.textContent = '✗ ' + err.message;
    status.className   = 'save-status err';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
